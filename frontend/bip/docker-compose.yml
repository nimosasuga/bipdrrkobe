services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drrkobe-bip-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    mem_limit: 1g
    cpus: 1.0
    networks:
      - proxy

networks:
  proxy:
    external: true
