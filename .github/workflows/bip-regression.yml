name: BIP Regression

on:
  push:
    paths:
      - 'frontend/bip/**'
      - 'backend/api/**'
      - '.github/workflows/bip-regression.yml'
  pull_request:
    paths:
      - 'frontend/bip/**'
      - 'backend/api/**'
      - '.github/workflows/bip-regression.yml'

jobs:
  frontend-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/bip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run BIP regression tests
        run: npm test

      - name: Build Next.js frontend
        run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate Laravel PHP syntax
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l
